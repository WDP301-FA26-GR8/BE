name: Backend CD (Deploy to VPS)

# H7-OPS-02, H7-OPS-RV-02 (docs/guides/containers.md#postgresql-roles-h7):
# - publish-only (manual): builds and pushes the image of exactly this commit as `<image>:<full sha>`; never touches the
#   VPS and never moves `latest`.
# - deploy (after CI on `main`, or manual): the same image, then the Compose/Caddy candidate is copied to
#   `<app dir>/releases/<full sha>/` and scripts/ops/deploy-release.sh runs it there; the live files are replaced only after
#   validation, backup, preflight, migrate and the role reconcile succeeded.
# - Each run of the deploy job is one attempt `<run id>-<run attempt>` (H7-OPS-RV-05): the host keeps its rollback evidence
#   in `releases/<full sha>/attempts/<attempt>/` and refuses an attempt it already has. A re-run gets a new attempt.
# - The host script succeeds only when the new release is ready and stable (H7-OPS-RV-04); otherwise it restores the
#   previous release, checks it, and exits non-zero.
# - `latest` names the last release deployed successfully: only the step after a successful host deployment moves it.
# - `concurrency` orders the deploy jobs of this workflow only. The host script itself takes the lock
#   `<app dir>/releases/.deploy.lock` (H7-OPS-RV-07), which also covers a deployment run by hand (runbook step 7): while
#   another deployment holds it, the script exits 2 before changing anything, this job fails and `latest` stays.
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: deploy
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish-only: build and push the image of this commit, no VPS. deploy: publish, then deploy.'
        type: choice
        options:
          - publish-only
          - deploy
        default: publish-only

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name and immutable commit tag
        id: meta
        run: |
          IMAGE_LOWERCASE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_LOWERCASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          # The commit tag only, in both modes; `latest` moves after a successful deployment (job deploy).
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS over SSH
    needs: build-and-push
    # publish-only never reaches a step that connects to the VPS.
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    # One deploy job of this workflow at a time, and `latest` moves in the order they finished. Manual deployments on the
    # host are serialized with these by the host lock of deploy-release.sh (H7-OPS-RV-07), not by this setting.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # A candidate of its own: the live docker-compose.prod.yml and Caddyfile are not touched here.
      - name: Copy the release candidate to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.prod.yml,Caddyfile,scripts/ops/deploy-release.sh'
          target: "${{ secrets.VPS_APP_DIR || '/opt/slm/backend' }}/releases/${{ github.sha }}"
          overwrite: true

      - name: Deploy the release on the VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          CR_PAT: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/slm/backend' }}
          RELEASE: ${{ github.sha }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          # One id per run of this job, never reused by GitHub: a re-run has a new run attempt (H7-OPS-RV-05).
          ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CR_PAT,REGISTRY_USER,APP_DIR,RELEASE,IMAGE,ATTEMPT
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            # Đăng nhập GHCR (hỗ trợ private image khi Organization chặn public package)
            if [ -n "$CR_PAT" ]; then
              echo "$CR_PAT" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin || true
            fi
            # Mọi bước (kiểm Compose và Caddyfile ứng viên, sao lưu, preflight, migrate, reconcile, promote, recreate, kiểm
            # readiness) nằm trong script của chính release này; lỗi trước promote giữ nguyên release live và container đang
            # chạy, lỗi lúc promote/recreate/readiness đưa cả release trước về và kiểm lại nó (H7-OPS-RV-02, RV-04). Mỗi lượt
            # chạy là một attempt riêng (RV-05). Một deploy khác (workflow hay chạy tay) đang giữ khóa host ⟹ script exit 2
            # trước mọi thay đổi (RV-07). Script lỗi thì bước đánh dấu `latest` không chạy.
            case "$ATTEMPT" in '' | *[!0-9-]*) echo 'refused: ATTEMPT is not <run id>-<run attempt>' >&2; exit 2 ;; esac
            bash "$APP_DIR/releases/$RELEASE/scripts/ops/deploy-release.sh" \
              --app-dir "$APP_DIR" --release "$RELEASE" --image "$IMAGE" --attempt "$ATTEMPT"

      # Runs only when the host deployment above succeeded: a failed deployment leaves `latest` on the last good release.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark the deployed release as latest
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          RELEASE: ${{ github.sha }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE"
