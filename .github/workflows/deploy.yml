name: Backend CD (Deploy to VPS)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name and short SHA tag
        id: meta
        run: |
          IMAGE_LOWERCASE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=${IMAGE_LOWERCASE}" >> $GITHUB_OUTPUT
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS over SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy Compose and Caddyfile to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.prod.yml,Caddyfile'
          target: "${{ secrets.VPS_APP_DIR || '/opt/slm/backend' }}"
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          CR_PAT: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CR_PAT,REGISTRY_USER
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e

            # 1. Chuyển vào thư mục chứa project trên VPS
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/opt/slm/backend"
            fi

            cd "$APP_DIR"

            # 2. Kiểm tra file .env an toàn
            if [ ! -f .env ]; then
              echo "❌ LỖI: Không tìm thấy file .env tại $APP_DIR. Hãy tạo file .env trước khi deploy!"
              exit 1
            fi

            # 2.5. Đăng nhập GHCR (hỗ trợ private image khi Organization chặn public package)
            if [ -n "$CR_PAT" ]; then
              echo "$CR_PAT" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin || true
            fi

            # 3. Đặt biến môi trường image cho docker-compose
            export API_IMAGE="${{ needs.build-and-push.outputs.image }}:latest"

            echo "🚀 Đang pull image mới nhất: $API_IMAGE"
            docker compose -f docker-compose.prod.yml pull api worker

            echo "📦 Khởi động database nếu chưa chạy..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans postgres

            # 3.5. DB-05: sao lưu trước migration. Không có down migration: khôi phục = roll-forward hoặc pg_restore bản
            # sao lưu này (docs/guides/containers.md). pg_dump hoặc kiểm đọc lỗi ⟹ dừng deploy trước `migrate deploy`.
            # Lệnh chạy trong container postgres qua socket cục bộ với biến của chính container; không in thông tin
            # đăng nhập. Thư mục cố định, chỉ chủ sở hữu đọc được; workflow không xóa bản sao lưu nào (dọn có giới hạn:
            # scripts/ops/postgres-backup-retention.sh, dry run trước, chạy tay).
            echo "⏳ Chờ PostgreSQL sẵn sàng..."
            READY=0
            for attempt in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T postgres sh -c 'pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
                READY=1
                break
              fi
              sleep 2
            done
            if [ "$READY" -ne 1 ]; then
              echo "❌ LỖI: PostgreSQL không sẵn sàng; dừng deploy trước khi sao lưu và migrate."
              exit 1
            fi

            BACKUP_DIR="$APP_DIR/backups/postgres"
            umask 077
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/slm-pre-migrate-$(date -u +%Y%m%dT%H%M%SZ)-${{ needs.build-and-push.outputs.tag }}.dump"

            echo "💾 Sao lưu CSDL trước migration: $BACKUP_FILE"
            if ! docker compose -f docker-compose.prod.yml exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom --no-owner --no-privileges' > "$BACKUP_FILE.partial"; then
              rm -f "$BACKUP_FILE.partial"
              echo "❌ LỖI: pg_dump thất bại; dừng deploy, chưa chạy migration."
              exit 1
            fi
            if [ ! -s "$BACKUP_FILE.partial" ] || ! docker compose -f docker-compose.prod.yml exec -T postgres pg_restore --list > /dev/null < "$BACKUP_FILE.partial"; then
              rm -f "$BACKUP_FILE.partial"
              echo "❌ LỖI: bản sao lưu rỗng hoặc pg_restore --list không đọc được; dừng deploy, chưa chạy migration."
              exit 1
            fi
            mv "$BACKUP_FILE.partial" "$BACKUP_FILE"
            echo "✅ Bản sao lưu đọc được ($(wc -c < "$BACKUP_FILE") byte). Số bản sao lưu hiện có: $(ls -1 "$BACKUP_DIR"/slm-pre-migrate-*.dump | wc -l)"

            # P28-01 (Prompt 29): migration 20261022120000 có thể dừng trên dữ liệu cũ; `ops:preflight` chỉ đọc và cho biết
            # `migrate deploy` có mang được CSDL này qua lịch sử migration không. Mã thoát khác 0 ⟹ dừng, chưa migrate.
            echo "🔎 Kiểm tra trước migration (ops:preflight, chỉ đọc)..."
            PREFLIGHT_STATUS=1
            for attempt in $(seq 1 3); do
              if docker compose -f docker-compose.prod.yml run --rm --no-deps \
                -e DB_CONNECT_TIMEOUT_MS=15000 \
                -e DB_TRANSACTION_MAX_WAIT_MS=10000 \
                -e DB_LOCK_TIMEOUT_MS=10000 \
                -e DB_STATEMENT_TIMEOUT_MS=15000 \
                -e DB_QUERY_TIMEOUT_MS=20000 \
                -e DB_TRANSACTION_TIMEOUT_MS=25000 \
                api node dist/migration-preflight-cli.js; then
                PREFLIGHT_STATUS=0
                break
              else
                PREFLIGHT_STATUS=$?
              fi

              if [ "$PREFLIGHT_STATUS" -eq 2 ]; then
                echo "⛔ ops:preflight phát hiện dữ liệu không tương thích (exit code 2); dừng deploy."
                break
              fi
              echo "⚠️ ops:preflight gặp lỗi tạm thời (exit code $PREFLIGHT_STATUS), thử lại sau 3s (lần $attempt/3)..."
              sleep 3
            done

            if [ "$PREFLIGHT_STATUS" -ne 0 ]; then
              echo "❌ LỖI: ops:preflight chặn migrate deploy; dừng deploy, chưa chạy migration."
              exit 1
            fi

            echo "🔄 Chạy Prisma Migration cập nhật Database..."
            docker compose -f docker-compose.prod.yml run --rm --no-deps api node node_modules/prisma/build/index.js migrate deploy

            echo "♻️ Khởi chạy lại container API, Worker & Caddy với code mới..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans api worker caddy

            echo "🧹 Dọn dẹp Docker images cũ..."
            docker image prune -f

            echo "🎉 Hoàn tất deploy Backend lên VPS thành công!"
