name: Backend CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'compose.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'infra/**'
      - 'openapi.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - '.cursor/rules/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - '.windsurfrules'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'rules-check.config.json'
      - '.prettierrc'
      - '.prettierignore'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'compose.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'infra/**'
      - 'openapi.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - '.cursor/rules/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - '.windsurfrules'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'rules-check.config.json'
      - '.prettierrc'
      - '.prettierignore'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_bootstrap -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local quality gate
        run: pnpm check

      - name: Run API E2E tests
        run: pnpm test:e2e

      - name: Provision ordinary integration role
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -X -U ci_bootstrap -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ci_integration LOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'ci-integration-only';
          SQL

      - name: Assert ordinary integration role
        env:
          PGPASSWORD: ci-integration-only
        run: |
          docker exec -i -e PGPASSWORD "${{ job.services.postgres.id }}" psql -X -h 127.0.0.1 -U ci_integration -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = current_user
                AND rolcanlogin AND rolcreatedb AND NOT rolsuper
                AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'Integration requires an ordinary LOGIN CREATEDB role';
            END IF;
          END;
          $$;
          SQL

      - name: Run isolated PostgreSQL integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://ci_integration:ci-integration-only@127.0.0.1:5432/postgres

      - name: Validate Compose and build runtime
        run: |
          docker compose config --quiet
          docker build -t slm-api:ci .

      - name: Verify OpenAPI export
        run: |
          pnpm openapi:export
          git diff --exit-code -- openapi.json

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
