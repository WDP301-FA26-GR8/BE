name: Backend CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'compose.yaml'
      - 'docker-compose.prod.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'infra/**'
      - 'openapi.json'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - '.cursor/rules/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - '.windsurfrules'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'rules-check.config.json'
      - '.prettierrc'
      - '.prettierignore'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'compose.yaml'
      - 'docker-compose.prod.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'infra/**'
      - 'openapi.json'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - '.cursor/rules/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - '.windsurfrules'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'rules-check.config.json'
      - '.prettierrc'
      - '.prettierignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_bootstrap -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local quality gate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm check

      - name: Run API E2E tests
        if: github.ref == 'refs/heads/main'
        run: pnpm test:e2e

      - name: Provision ordinary integration role
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -X -U ci_bootstrap -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ci_integration LOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'ci-integration-only';
          SQL

      - name: Assert ordinary integration role
        env:
          PGPASSWORD: ci-integration-only
        run: |
          docker exec -i -e PGPASSWORD "${{ job.services.postgres.id }}" psql -X -h 127.0.0.1 -U ci_integration -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = current_user
                AND rolcanlogin AND rolcreatedb AND NOT rolsuper
                AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'Integration requires an ordinary LOGIN CREATEDB role';
            END IF;
          END;
          $$;
          SQL

      # DB-16: deploy every committed migration into an empty CI database, then fail when the Prisma schema
      # describes anything the migrations do not create (a schema change committed without its migration).
      - name: Check Prisma schema against committed migrations
        env:
          PGPASSWORD: ci-integration-only
          NODE_ENV: development
          DATABASE_URL: postgresql://ci_integration:ci-integration-only@127.0.0.1:5432/slm_ci_migration_drift
        run: |
          docker exec -i -e PGPASSWORD "${{ job.services.postgres.id }}" psql -X -h 127.0.0.1 -U ci_integration -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE slm_ci_migration_drift;'
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma --exit-code

      - name: Run isolated PostgreSQL integration tests
        if: github.ref == 'refs/heads/main'
        run: pnpm test:integration
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://ci_integration:ci-integration-only@127.0.0.1:5432/postgres
          # H7: the role-separation suites play the cluster administrator of this disposable service container only.
          TEST_DATABASE_BOOTSTRAP_URL: postgresql://ci_bootstrap:ci-bootstrap-only@127.0.0.1:5432/postgres

      - name: Validate Compose configuration
        run: docker compose config --quiet

      # H7: every profile of the production file interpolates with the three role passwords, and refuses without one.
      - name: Validate production Compose configuration
        run: |
          : > .env.app
          printf 'POSTGRES_PASSWORD=ci-placeholder-bootstrap\nDATABASE_DEPLOY_PASSWORD=ci-placeholder-deploy\nDATABASE_RUNTIME_PASSWORD=ci-placeholder-runtime\n' > "$RUNNER_TEMP/prod.env"
          docker compose --env-file "$RUNNER_TEMP/prod.env" -f docker-compose.prod.yml --profile deploy --profile admin config --quiet
          grep -v RUNTIME "$RUNNER_TEMP/prod.env" > "$RUNNER_TEMP/prod-missing.env"
          if docker compose --env-file "$RUNNER_TEMP/prod-missing.env" -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo 'docker-compose.prod.yml accepted a missing DATABASE_RUNTIME_PASSWORD' >&2
            exit 1
          fi
          rm .env.app

      - name: Verify OpenAPI export
        run: |
          pnpm openapi:export
          git diff --exit-code -- openapi.json

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  deploy:
    name: Deploy to VPS
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      mode: deploy
    secrets: inherit
