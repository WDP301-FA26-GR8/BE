name: Backend CI

# Test tiers (docs/workspace/items/be-test-architecture-redesign/spec.md, OD-T2, OD-T5):
# - quality: rules, format, lint, typecheck, unit, static gates, architecture, build, schema drift, OpenAPI, audit.
# - http-contract: test/http, one Nest application per file, no database.
# - select: chooses affected suites without installing dependencies.
# - integration: three parallel shards against disposable PostgreSQL; integration-inband runs timing and serial suites.
#   On dev/PR only affected modules and their dependents; on main and by hand, everything.
# - e2e-smoke: a few business journeys end to end, on main and by hand.
# - deploy: only from main, only when every test job above passed. Weekly Sunday runs everything on dev (nightly.yml).
# No step hides a failure (no continue-on-error, no `|| true`).

on:
  pull_request:
    branches: [dev]
    paths: &watched
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'compose.yaml'
      - 'docker-compose.prod.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'infra/**'
      - 'openapi.json'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - '.dependency-cruiser.cjs'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - '.cursor/rules/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - '.windsurfrules'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'rules-check.config.json'
      - '.prettierrc'
      - '.prettierignore'
  push:
    branches: [main, dev]
    paths: *watched
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# OD-CI2: only pull-request runs replace each other (their suites come from the PR base). Every push and manual run has a
# group of its own: a queued push run must never be dropped, because the next push only tests the commits after it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      paths: ${{ steps.select.outputs.paths }}
      serial: ${{ steps.select.outputs.serial }}
      timing: ${{ steps.select.outputs.timing }}
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Choose the integration suites
        id: select
        env:
          SKIP_DEPLOY_DEV: ${{ github.repository == 'WDP301-FA26-GR8/BE' && github.ref == 'refs/heads/dev' && github.event_name == 'push' }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$SKIP_DEPLOY_DEV" = "true" ]; then
            printf 'run=false\npaths=NONE\nserial=NO-SERIAL\ntiming=NO-TIMING\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'run=true\n' >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PATHS=ALL
            SERIAL=SERIAL
          else
            # A base this clone does not have (force push, rewritten history) counts as unknown: run everything.
            if [ -n "$BASE" ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=0000000000000000000000000000000000000000; fi
            node scripts/ci/affected-modules.mjs "$BASE" "$GITHUB_SHA" > "$RUNNER_TEMP/affected.txt"
            PATHS="$(sed -n 1p "$RUNNER_TEMP/affected.txt")"
            SERIAL="$(sed -n 2p "$RUNNER_TEMP/affected.txt")"
          fi
          # Start the in-band job for *.timing-spec.ts only when a selected folder holds one.
          TIMING=NO-TIMING
          if [ "$PATHS" = "ALL" ]; then
            TIMING=TIMING
          elif [ "$PATHS" != "NONE" ]; then
            for dir in $PATHS; do
              if git ls-files -- "$dir" | grep -q '\.timing-spec\.ts$'; then TIMING=TIMING; fi
            done
          fi
          printf 'paths=%s\nserial=%s\ntiming=%s\n' "$PATHS" "$SERIAL" "$TIMING" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  quality:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres: &postgres
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_bootstrap -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the backend
        uses: ./.github/actions/setup

      - name: Run local quality gate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm check

      - name: Provision the test database role
        uses: ./.github/actions/test-database
        with:
          container: ${{ job.services.postgres.id }}

      # DB-16: deploy every committed migration into an empty CI database, then fail when the Prisma schema
      # describes anything the migrations do not create (a schema change committed without its migration).
      - name: Check Prisma schema against committed migrations
        env:
          PGPASSWORD: ci-integration-only
          NODE_ENV: development
          DATABASE_URL: postgresql://ci_integration:ci-integration-only@127.0.0.1:5432/slm_ci_migration_drift
        run: |
          docker exec -i -e PGPASSWORD "${{ job.services.postgres.id }}" psql -X -h 127.0.0.1 -U ci_integration -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE slm_ci_migration_drift;'
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma --exit-code

      - name: Validate Compose configuration
        run: docker compose config --quiet

      # H7: every profile of the production file interpolates with the three role passwords, and refuses without one.
      - name: Validate production Compose configuration
        run: |
          : > .env.app
          printf 'POSTGRES_PASSWORD=ci-placeholder-bootstrap\nDATABASE_DEPLOY_PASSWORD=ci-placeholder-deploy\nDATABASE_RUNTIME_PASSWORD=ci-placeholder-runtime\n' > "$RUNNER_TEMP/prod.env"
          docker compose --env-file "$RUNNER_TEMP/prod.env" -f docker-compose.prod.yml --profile deploy --profile admin config --quiet
          grep -v RUNTIME "$RUNNER_TEMP/prod.env" > "$RUNNER_TEMP/prod-missing.env"
          if docker compose --env-file "$RUNNER_TEMP/prod-missing.env" -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo 'docker-compose.prod.yml accepted a missing DATABASE_RUNTIME_PASSWORD' >&2
            exit 1
          fi
          rm .env.app

      - name: Verify OpenAPI export
        run: |
          pnpm openapi:export
          git diff --exit-code -- openapi.json

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Keep test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-quality
          path: reports/test-timings/
          if-no-files-found: ignore

  http-contract:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the backend
        uses: ./.github/actions/setup

      - name: Run HTTP contract tests
        run: pnpm test:http --maxWorkers=2

      - name: Keep test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-http
          path: reports/test-timings/
          if-no-files-found: ignore

  integration:
    needs: select
    if: needs.select.outputs.run == 'true' && needs.select.outputs.paths != 'NONE'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    # Keep initial headroom until two main runs provide shard measurements.
    timeout-minutes: 70
    services:
      postgres: *postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the backend
        uses: ./.github/actions/setup

      - name: Provision the test database role
        uses: ./.github/actions/test-database
        with:
          container: ${{ job.services.postgres.id }}

      # The CLI suites start the built `dist/cli.js` (TEST_CLI_RUNTIME=dist) instead of compiling the sources per call.
      - name: Build
        run: pnpm build

      - name: Run integration tests (parallel files)
        env:
          PATHS: ${{ needs.select.outputs.paths }}
          TEST_DATABASE_ADMIN_URL: postgresql://ci_integration:ci-integration-only@127.0.0.1:5432/postgres
          TEST_CLI_RUNTIME: dist
        run: |
          if [ "$PATHS" = "ALL" ]; then pnpm test:integration --maxWorkers=2 --shard=${{ matrix.shard }}/3 --passWithNoTests; else pnpm test:integration --maxWorkers=2 --shard=${{ matrix.shard }}/3 --passWithNoTests $PATHS; fi

      - name: Keep test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-integration-${{ matrix.shard }}
          path: reports/test-timings/
          if-no-files-found: ignore

  integration-inband:
    needs: select
    if: needs.select.outputs.run == 'true' && (needs.select.outputs.timing == 'TIMING' || needs.select.outputs.serial == 'SERIAL')
    runs-on: ubuntu-latest
    # Keep initial headroom until two main runs provide shard measurements.
    timeout-minutes: 70
    services:
      postgres: *postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the backend
        uses: ./.github/actions/setup

      - name: Provision the test database role
        uses: ./.github/actions/test-database
        with:
          container: ${{ job.services.postgres.id }}

      # The CLI suites start the built `dist/cli.js` (TEST_CLI_RUNTIME=dist) instead of compiling the sources per call.
      - name: Build
        run: pnpm build

      # The same modules' *.timing-spec.ts: their wall-clock bounds hold only with no other file running.
      - name: Run integration tests that bound wall-clock time (in band)
        if: needs.select.outputs.timing == 'TIMING'
        env:
          PATHS: ${{ needs.select.outputs.paths }}
          TEST_DATABASE_ADMIN_URL: postgresql://ci_integration:ci-integration-only@127.0.0.1:5432/postgres
        run: |
          if [ "$PATHS" = "ALL" ]; then pnpm test:integration:timing; else pnpm test:integration:timing $PATHS; fi

      - name: Run integration tests that share the cluster (in band)
        if: needs.select.outputs.serial == 'SERIAL'
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://ci_integration:ci-integration-only@127.0.0.1:5432/postgres
          TEST_CLI_RUNTIME: dist
          # H7: the role-separation suites play the cluster administrator of the disposable service container only.
          TEST_DATABASE_BOOTSTRAP_URL: postgresql://ci_bootstrap:ci-bootstrap-only@127.0.0.1:5432/postgres
        run: pnpm test:integration:serial

      - name: Keep test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-integration-inband
          path: reports/test-timings/
          if-no-files-found: ignore

  e2e-smoke:
    needs: select
    if: needs.select.outputs.run == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: *postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the backend
        uses: ./.github/actions/setup

      - name: Provision the test database role
        uses: ./.github/actions/test-database
        with:
          container: ${{ job.services.postgres.id }}

      - name: Run end-to-end smoke journeys
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://ci_integration:ci-integration-only@127.0.0.1:5432/postgres
        run: pnpm test:e2e

  deploy:
    name: Deploy to VPS
    needs: [quality, http-contract, integration, integration-inband, e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      mode: deploy
    secrets: inherit
