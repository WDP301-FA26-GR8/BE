name: Set up the backend
description: pnpm, Node.js with the pnpm cache, dependencies from the lockfile, and the generated Prisma client.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.1.3
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate the Prisma client
      shell: bash
      run: pnpm prisma:generate
