name: software-license-management

# Local development. "docker compose up -d --wait" starts PostgreSQL only: the API and the worker need nothing else
# today. Redis (profile "queue") and MinIO (profile "storage") are optional, for a G7/G9 slice that mounts the queue or
# object storage again (Owner decision E2 = A): "docker compose --profile queue --profile storage up -d --wait".
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: software_license_management
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d software_license_management']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ['queue']
    image: redis:8-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: ['storage']
    build: ./infra/minio
    image: slm-minio:2025-10-15
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
